name: Test and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run docs:check
      - run: npm run build
      - run: node --check dist/jiangnan-safety-assistant.user.js
      - run: git diff --exit-code -- dist/jiangnan-safety-assistant.user.js
